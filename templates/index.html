<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search Engine</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/tailwindcss/2.2.19/tailwind.min.css">
</head>
<body class="bg-gray-100 flex flex-col items-center py-10">
    <h1 class="text-3xl font-bold mb-6">Search Engine</h1>
    <form method="post" class="w-full max-w-lg bg-white p-6 rounded-lg shadow-md">
        <input type="text" name="query" value="{{ query }}" placeholder="Enter your search query..."
               class="w-full p-2 border rounded-md">
        <button type="submit" class="mt-3 w-full bg-blue-500 text-white py-2 rounded-md hover:bg-blue-600">Search</button>
    </form>

    {% if results %}
        <div class="mt-6 w-full max-w-lg bg-white p-6 rounded-lg shadow-md">
            <h2 class="text-xl font-semibold mb-4">Top 10 Results</h2>
            <ul>
                {% for doc_id, score in results %}
                    <li class="border-b py-2">Document {{ doc_id }} - Relevance: {{ score|round(4) }}</li>
                {% endfor %}
            </ul>
        </div>
    {% endif %}
</body>
</html>
